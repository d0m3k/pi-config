# oh-my-pi (omp) status line — NOT pi
#
# This file configures the status line of **oh-my-pi (`omp`)**, the harness in
# which these settings are rendered. It is not read by `pi` and has nothing to
# do with `../settings.json` or the extensions in `../extensions/` (those are
# pi packages).
#
# Two ways to use it:
#   1. Try it without touching your config:  omp --config <path to this file>
#   2. Make it permanent:                    ./setup.sh   (appends this block to
#                                            ~/.omp/agent/config.yml if the file
#                                            has no statusLine section yet)
#
# The OpenCode Go plan windows are NOT a segment here: on a narrow terminal the
# status line drops its last segment until the line fits, and the built-in
# `usage` segment (~52 columns) is the first to go. They are published as an
# extra row below the bar by `extensions/opencode-go-status.ts` instead, so the
# numbers survive on a phone-width screen. See README.md.

statusLine:
  # Required: leftSegments/rightSegments are only honoured when preset is
  # "custom" — with any other preset the segment lists below are ignored.
  preset: custom
  separator: powerline-thin
  # Same order as the built-in "default" preset minus `usage`; the layout drops
  # segments from the end of this list (skipping `path`, which shrinks instead),
  # so the earliest entries survive the narrowest terminals.
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - collab
    - stream
    - path
    - git
    - pr
    - context_pct
    - cost
  rightSegments:
    - session_name
  # Copied from the built-in "default" preset so the other segments render
  # exactly as they do there.
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
